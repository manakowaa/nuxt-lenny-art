<svg 
  viewBox="0 0 110 110" 
  xmlns="http://www.w3.org/2000/svg"
  width="110"
  height="110"
  fill="none"
>
  <defs>
    <clipPath id="locationClip">
      <rect 
        width="24" 
        height="24" 
        x="43" 
        y="43"
      />
    </clipPath>
  </defs>

  <rect 
    id="location-bg"
    width="110"
    height="110"
    x="0"
    y="0"
    fill="rgb(31,30,30)"
  />

  <g 
    id="location-icon"
    clip-path="url(#locationClip)"
  >

    <rect
      id="location-inner"
      width="24"
      height="24"
      x="43"
      y="43"
    />

    <circle
      id="location-dot"
      cx="55"
      cy="55"
      r="9"
      fill="rgb(188,62,45)"
    />

  </g>

</svg>